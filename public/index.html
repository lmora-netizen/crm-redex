<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Redex · BDB Logística</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sin-sesion">
  <section id="acceso" class="acceso"></section>

  <header class="barra-sup">
    <div class="marca">
      <span class="placa-logo"><img src="img/logo-bdb.png" alt="BDB Logística"></span>
      <div><strong>CRM Redex</strong><small>Coordinación de capacidad</small></div>
    </div>
    <nav class="pestanas" id="pestanas">
      <button data-vista="resumen">Resumen</button>
      <button data-vista="tablero">Tablero</button>
      <button data-vista="pipeline">Proveedores</button>
      <button data-vista="onboarding">Onboarding</button>
      <button data-vista="catalogos">Catálogos</button>
      <button data-vista="usuarios" data-solo-admin hidden>Usuarios</button>
    </nav>
    <div class="usuario" id="usuario-actual"></div>
  </header>

  <main id="vista"><p class="cargando">Cargando…</p></main>

  <dialog id="modal"></dialog>
  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
